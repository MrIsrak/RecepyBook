name: Идея
description: Предложить новую возможность
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу это решает
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Как это могло бы работать
  - type: textarea
    id: alternatives
    attributes:
      label: Как ты справляешься сейчас
