name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem would this solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How could it work from the user's point of view?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: How do you handle this today?
