name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Surface build errors as annotations
        if: failure()
        run: |
          grep -E '^e: |What went wrong|FAILED|Could not |error:|Exception' build.log | head -40 | while IFS= read -r l; do
            echo "::error::${l:0:900}"
          done
          grep -A12 'What went wrong' build.log | head -60 | tr '\n' ' ' | cut -c1-3000 | sed 's/^/::error title=gradle::/'

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore

      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RecepyBook-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
